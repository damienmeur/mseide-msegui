# argot — https://argot.tmonier.com/docs/configure/
#
# What shapes MSEgui's learned voice. Every exclusion below is evidence-backed;
# see the trailing reason on each line. Coldness alone is NOT a reason to
# exclude — hand-written subsystems nobody touched last year are still our
# voice. These six are vendored, forked, machine-generated, or peripheral.

[exclude]
paths = [
  "lib/common/mzeoslib/",        # vendored ZEOS DB library: edit_ratio 0.035, arrived in one commit, 98% never edited since
  "lib/common/fpccompatibility/",# forked FPC RTL/FCL units: 72 of 108 files carry the Free Pascal copyright + COPYING.FPC
  "**/*_mfm.pas",                # generated by tools/form2pas.pas: all 105 are one `data: array[0..N] of byte` literal
  "**/*_bmp.pas",                # generated by tools/bmp2pas.pas: icon byte blobs, same shape
  "tools/",                      # build-time CLIs (bmp2pas, form2pas, i18n, unitdep) + PO/MO demos: 2 commits in 3 years
  "apps/demo/",                  # sample app teaching third-party API use, not framework voice
  "apps/facedemo/",              # sample app teaching third-party API use, not framework voice
  "apps/i18ndemo/",              # sample app teaching third-party API use, not framework voice
  "apps/myide/",                 # sample app teaching third-party API use, not framework voice
]
