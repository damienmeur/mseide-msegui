---
name: argot

on:
  # Consumer: every PR reads the model published by the push run below.
  pull_request:
  # Producer: fits the voice on the default branch and publishes it to the
  # cache. Removing this trigger makes every pull request pay for the fit.
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write     # sticky findings comment
  security-events: write   # SARIF code-scanning annotations

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # argot fits against the PR's base branch

      - name: argot
        uses: get-tmonier/argot@main
