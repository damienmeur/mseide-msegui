---
# Advisory only: argot-check reports findings and always succeeds.
# Swap the id for argot-check-gate to make error-severity findings block
# the commit. Requires argot on PATH — pre-commit will not install the
# binary — and a committed .argot/ fit snapshot.
repos:
  - repo: https://github.com/get-tmonier/argot
    rev: v0.2.116
    hooks:
      - id: argot-check
